<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Żelazna Korona — Dowództwo</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="inventory.css">
<link rel="stylesheet" href="expedition.css">
</head>
<body>
<div id="app" class="app" data-tod="day">

  <!-- TŁO: niebo, miasto, cząsteczki -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="stars" id="stars"></div>
    <div class="orb" id="orb"></div>
    <div class="clouds" id="clouds"></div>
    <svg id="skyline" class="skyline" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice"></svg>
    <canvas id="embers" class="embers"></canvas>
    <div class="vignette"></div>
  </div>

  <!-- GÓRNY PASEK -->
  <header class="top">
    <div class="logo"><span class="logo-ic">⚔</span><b>ŻELAZNA KORONA</b><small>Dowództwo</small></div>
    <div class="res">
      <div class="chip" title="Złoto"><i>🪙</i><b id="r-gold" class="cnt">0</b></div>
      <div class="chip clock"><i>🕒</i><b id="r-clock">--:--</b></div>
    </div>
  </header>

  <main class="grid">

    <section class="welcome">
      <small>WITAJ Z POWROTEM, BOHATERZE</small>
      <h2><span id="w-name">Gracz</span>, świat czeka na Ciebie</h2>
    </section>

    <!-- POSTAĆ -->
    <section class="card hero" id="hero-card">
      <div class="hero-glow"></div>
      <div class="avatar-wrap">
        <svg class="ring" viewBox="0 0 160 160">
          <circle class="ring-bg" cx="80" cy="80" r="70"/>
          <circle class="ring-xp" id="ring-xp" cx="80" cy="80" r="70"/>
          <circle class="ring-spin" cx="80" cy="80" r="76"/>
        </svg>
        <div class="avatar" id="avatar">🛡️</div>
        <div class="lvl"><small>POZIOM</small><b id="h-lvl">1</b></div>
      </div>
      <div class="hero-info">
        <h1 id="h-name">Gracz</h1>
        <div class="sub"><span id="h-guild">⚜️ Gildia: Strażnicy Zmierzchu</span> · <span id="h-server">Serwer Wschód</span></div>
        <div class="xpline"><div class="xpbar"><i id="xp-fill"></i></div><small id="xp-txt">0 / 0 EXP</small></div>
        <div class="vitals">
          <div class="vbar hp"><i id="hp-fill"></i><span><small>ŻYCIE</small><b id="hp-txt">0 / 0</b></span></div>
          <div class="vbar mp"><i id="mp-fill"></i><span><small>MANA</small><b id="mp-txt">0 / 0</b></span></div>
        </div>
      </div>
    </section>

    <!-- KAFLE TRYBÓW -->
    <section class="tiles" id="tiles"></section>

    <!-- KANAŁ ZDARZEŃ -->
    <section class="card feed">
      <div class="feed-h"><b>📜 Ostatnie zdarzenia</b><small>na żywo</small></div>
      <div id="feed" class="feed-list"></div>
    </section>

  </main>

  <div id="toast" class="toast" role="status"></div>
</div>
<script src="sim.js"></script>
<script src="inventory.js"></script>
<script src="panel.js"></script>
<script src="expedition.js"></script>
</body>
</html>
